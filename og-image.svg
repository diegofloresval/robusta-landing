<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <style>
      .brand { font-family: "Sora", system-ui, sans-serif; font-weight: 700; fill: #1A1A1A; letter-spacing: 0.04em; }
      .brand-sub { font-family: "DM Sans", system-ui, sans-serif; font-weight: 500; fill: #6B6B6B; letter-spacing: 0.42em; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#F9F6F0"/>

  <!-- Centered brand: mark + wordmark -->
  <g transform="translate(600, 315)">
    <!-- Brand mark, scaled and centered above wordmark -->
    <g transform="translate(-80, -150) scale(5)">
      <circle cx="8"  cy="8"  r="3.2" fill="#E84A8E"/>
      <circle cx="24" cy="10" r="2.4" fill="#00B5C7"/>
      <circle cx="20" cy="24" r="3.6" fill="#1F2D5C"/>
      <circle cx="6"  cy="22" r="2"   fill="#F5C518"/>
      <path d="M8 8 L24 10 L20 24 L6 22 Z" stroke="#1A1A1A" stroke-width=".6" fill="none" opacity=".4"/>
    </g>

    <!-- ROBUSTA wordmark -->
    <text x="0" y="60" text-anchor="middle" class="brand" font-size="120">ROBUSTA</text>
    <!-- INSIGHTS sublabel -->
    <text x="0" y="115" text-anchor="middle" class="brand-sub" font-size="28">I N S I G H T S</text>
  </g>
</svg>
